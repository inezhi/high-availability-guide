<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:url" content="https://inezhi.github.io/high-availability-guide/{{SLUG}}">
  <link rel="canonical" href="https://inezhi.github.io/high-availability-guide/{{SLUG}}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308121b'/%3E%3Cpath d='M5 17h5l2.5-7 4 12 3-9 1.8 4H27' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v={{VERSION}}">
</head>
<body class="{{BODY_CLASS}}">
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="scroll-progress" aria-hidden="true"><span id="progressBar"></span></div>

  {{SPRITE}}

  <aside class="rail" id="rail">
    <a class="rail-brand" href="index.html" aria-label="返回首页">
      <span class="brand-mark"><svg class="icon"><use href="#i-pulse"/></svg></span>
      <span class="brand-text"><strong>高可用架构</strong><small>从指标到故障转移</small></span>
    </a>
    <p class="rail-label">章节目录</p>
    <nav class="rail-nav" aria-label="全书章节">
      {{NAV}}
    </nav>
    <div class="rail-foot">
      <div class="rail-meter" aria-hidden="true"><span id="railProgress"></span></div>
      <div class="rail-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切换到浅色主题" title="切换主题">
          <svg class="icon icon-sun"><use href="#i-sun"/></svg>
          <svg class="icon icon-moon"><use href="#i-moon"/></svg>
        </button>
        <a class="icon-btn" href="https://github.com/inezhi/high-availability-guide" target="_blank" rel="noreferrer" aria-label="GitHub 仓库" title="GitHub 仓库">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02.8-.22 1.65-.33 2.5-.33s1.7.11 2.5.33c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85V21c0 .27.18.58.69.48A10 10 0 0 0 12 2Z" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>
    </div>
  </aside>

  <header class="mobile-bar">
    <a class="mobile-brand" href="index.html"><svg class="icon"><use href="#i-pulse"/></svg><span>高可用架构</span></a>
    <button class="icon-btn" id="menuToggle" type="button" aria-expanded="false" aria-controls="mobileIndex" aria-label="打开目录">
      <svg class="icon icon-menu"><use href="#i-menu"/></svg>
      <svg class="icon icon-close"><use href="#i-close"/></svg>
    </button>
  </header>
  <nav class="mobile-index" id="mobileIndex" aria-label="移动端全书目录">
    {{MOBILE_NAV}}
  </nav>

  <main id="main" class="{{MAIN_CLASS}}">
    {{BODY}}

  <footer class="site-foot">
    <div class="foot-main">
      <span class="brand-mark"><svg class="icon"><use href="#i-pulse"/></svg></span>
      <div><strong>高可用架构 · 从指标到故障转移</strong><p>内容依据《四大原则 · 01-高可用架构》整理，并补充了公开资料中的通用工程实践；交互与视觉为学习用途重新制作。</p></div>
    </div>
    <div class="foot-meta">
      <span class="mono">SYSTEM DESIGN NOTES / 01</span>
      <span>部署于 GitHub Pages · {{YEAR}}</span>
      <a href="https://github.com/inezhi/high-availability-guide" target="_blank" rel="noreferrer">GitHub 仓库</a>
    </div>
  </footer>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="放大图示" hidden>
    <div class="lightbox-panel">
      <div class="lightbox-bar">
        <span class="lightbox-caption" id="lightboxCaption"></span>
        <div class="lightbox-actions">
          <button class="btn btn-small btn-ghost" id="lightboxZoom" type="button">放大</button>
          <button class="btn btn-small btn-ghost" id="lightboxClose" type="button">关闭</button>
        </div>
      </div>
      <div class="lightbox-stage" id="lightboxStage"></div>
      <p class="lightbox-hint">点击图示可继续放大 · 按 Esc 关闭</p>
    </div>
  </div>

  <button class="to-top" id="toTop" type="button" aria-label="回到顶部"><svg class="icon"><use href="#i-up"/></svg></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v={{VERSION}}" defer></script>
</body>
</html>
