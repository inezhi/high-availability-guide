<div class="quiz instrument" id="quizCard">
          <div class="instrument-bar">
            <span class="status-dot status-dot-good"></span>
            <span class="instrument-title">七道题</span>
            <span class="instrument-meta mono" id="quizProgress">1 / 7</span>
          </div>
          <div class="quiz-body">
            <p class="quiz-question" id="quizQuestion">加载中…</p>
            <div class="quiz-options" id="quizOptions" role="group" aria-labelledby="quizQuestion"></div>
            <p class="quiz-feedback" id="quizFeedback" aria-live="polite"></p>
            <div class="quiz-foot">
              <button class="btn btn-small btn-primary" id="quizNext" type="button" disabled>下一题</button>
            </div>
          </div>
          <div class="quiz-result" id="quizResult" hidden>
            <span class="quiz-score" id="quizScore">0 / 7</span>
            <p id="quizVerdict"></p>
            <button class="btn btn-small btn-ghost" id="quizRestart" type="button">再来一次</button>
          </div>
        </div>
